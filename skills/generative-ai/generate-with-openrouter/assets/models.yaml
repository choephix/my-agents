models:
  - id: "google/gemini-3.1-flash-lite-image"
    name: "Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image)"
    aliases: ["nano banana 2 lite", "nb2 lite"]
    capabilities: [text-to-image, image-editing]
    description: "Google's fastest and most cost-efficient Gemini image model targets high-volume generation and reference-based editing."
    notes: "Approx $0.039 per 1024px image, assuming about 1290 image-output tokens at $0.00003/token; actual token use varies. The Lite variant prioritizes speed and cost."
    input:
      required: ["prompt"]
      params:
        prompt: "string — what to generate or how to edit the supplied images"
        images: "array of URLs or local paths — reference/edit inputs (optional)"

